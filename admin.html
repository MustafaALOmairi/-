<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم – بصمة إبداع</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo Bhaijaan 2',system-ui,sans-serif;background:#fbf5ec;color:#2b1d1d;padding-bottom:40px}
.stripes{height:8px;display:flex}.stripes i{flex:1}.stripes i:nth-child(1){background:#fff}.stripes i:nth-child(2){background:#d6202f}.stripes i:nth-child(3){background:#0f8a3c}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
header h1{font-size:24px;color:#a3121f;display:flex;align-items:center;gap:8px}
header img{width:44px}
.card{background:#fff;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 6px 0 #ecdcc4}
.card h2{font-size:20px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{font-weight:700;font-size:14px;color:#6b4b4b;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid #eadfce;border-radius:12px;font-family:inherit;font-size:16px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;background:#f3ebe0;color:#2b1d1d}
.btnlink{display:inline-block;text-decoration:none;border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px}
.g{background:#0f8a3c;color:#fff}.r{background:#d6202f;color:#fff}.wa{background:#25d366;color:#fff}
.big{width:100%;margin-top:12px;padding:14px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 4px 0 #ecdcc4}
.stat b{display:block;font-size:26px;color:#0a6a2d}
.stat span{font-size:13px;color:#6b4b4b;font-weight:700}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px}
.lic{background:#fff;border-radius:18px;padding:14px;margin-top:10px;border-right:8px solid #0f8a3c;box-shadow:0 4px 0 #ecdcc4}
.lic.off{border-color:#999;opacity:.75}.lic.exp{border-color:#f39c12}
.lic .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.lic .nm{font-size:19px;font-weight:800}
.code{font-family:monospace;font-size:18px;font-weight:800;background:#f6efe5;padding:4px 10px;border-radius:10px;direction:ltr;letter-spacing:1px}
.meta{font-size:14px;color:#6b4b4b;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{padding:7px 12px;font-size:14px}
.devs{margin-top:8px;font-size:13px;color:#6b4b4b;display:none}
.devs div{display:flex;justify-content:space-between;gap:8px;background:#faf6f0;border-radius:10px;padding:6px 10px;margin-top:4px}
.msgbox{white-space:pre-wrap;background:#f0faf3;border:2px dashed #0f8a3c;border-radius:14px;padding:12px;margin-top:10px;font-size:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(140px);background:#2b1d1d;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:.3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(40,20,20,.45);display:none;place-items:center;padding:16px;z-index:8}.modal.on{display:grid}
.modal .box{background:#fff;border-radius:20px;padding:20px;width:min(440px,100%)}
#login{max-width:380px;margin:12vh auto 0;text-align:center}
#login img{width:150px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>➕ كود جديد لمعلمة</h2>
    <div class="grid">
      <div><label>اسم المعلمة *</label><input id="n_name" placeholder="أ. فاطمة البلوشية"></div>
      <div><label>المدرسة</label><input id="n_school" placeholder="مدرسة …"></div>
      <div><label>رقم الهاتف</label><input id="n_phone" placeholder="9xxxxxxx" inputmode="tel"></div>
      <div><label>عدد الأجهزة</label><input id="n_dev" type="number" min="1" max="20" value="2"></div>
      <div><label>مدة الاشتراك</label><select id="n_months"><option value="3">٣ أشهر</option><option value="6">٦ أشهر</option><option value="12" selected>سنة</option><option value="24">سنتان</option><option value="0">بدون انتهاء</option></select></div>
      <div><label>ملاحظات</label><input id="n_notes" placeholder="مثلاً: دفعت 5 ريال"></div>
    </div>
    <button class="g big" id="createBtn">إنشاء الكود</button>
    <div id="created" style="display:none">
      <div class="msgbox" id="msgText"></div>
      <div class="acts"><button class="g" id="copyMsg">📋 نسخ الرسالة</button><a class="wa btnlink" id="waLink" href="#" target="_blank" rel="noopener">📲 إرسال واتساب</a><a class="btnlink" id="waApp" href="#" style="background:#e7f8ee;color:#0a6a2d">فتح تطبيق واتساب مباشرة</a></div>
    </div>
  </div>

  <div class="tools">
    <input id="search" placeholder="🔍 بحث بالاسم أو المدرسة أو الكود">
    <select id="filter" style="width:auto"><option value="all">الكل</option><option value="on">فعّال</option><option value="off">موقوف</option><option value="exp">منتهي</option></select>
    <button id="refresh">🔄 تحديث</button>
  </div>
  <div id="list"></div>
</div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>
const FN="https://kxwodxkisztrslzhfmda.supabase.co/functions/v1/ndq-admin";
const APP_URL=new URL("./",location.href).href;
const $=s=>document.querySelector(s);
let PW=sessionStorage.getItem("adm_pw")||"",LICS=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2000)}
async function api(action,data={}){
  const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:PW,action,...data})});
  const d=await r.json().catch(()=>({ok:false,error:"خطأ في الاتصال"}));
  if(!d.ok&&r.status===401){logout();throw new Error(d.error)}
  if(!d.ok)throw new Error(d.error||"خطأ");return d;
}
function ask(html,btns){return new Promise(res=>{$("#mbox").innerHTML=html+`<div class="acts" style="margin-top:14px">${btns.map((b,i)=>`<button data-i="${i}" class="${b.c||''}">${b.t}</button>`).join("")}</div>`;
  $("#modal").classList.add("on");$("#mbox").querySelectorAll("[data-i]").forEach(x=>x.onclick=()=>{$("#modal").classList.remove("on");res(btns[+x.dataset.i].v)})})}
async function login(){PW=$("#pw").value;$("#loginErr").textContent="";
  try{await api("login");sessionStorage.setItem("adm_pw",PW);start()}catch(e){$("#loginErr").textContent=e.message}}
function logout(){PW="";sessionStorage.removeItem("adm_pw");$("#app").style.display="none";$("#login").style.display="block"}
$("#loginBtn").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login()};$("#logout").onclick=logout;
async function start(){$("#login").style.display="none";$("#app").style.display="block";await load()}
async function load(){try{LICS=(await api("list")).licenses;render()}catch(e){toast(e.message)}}
const fmtD=d=>d?new Date(d).toLocaleDateString("ar-OM",{year:"numeric",month:"short",day:"numeric"}):"بدون انتهاء";
const isExp=l=>l.expires_at&&new Date(l.expires_at)<new Date();
function render(){
  const on=LICS.filter(l=>l.active&&!isExp(l)).length,dev=LICS.reduce((a,l)=>a+l.devices.length,0);
  $("#stats").innerHTML=[["الأكواد",LICS.length],["فعّال",on],["الأجهزة المفعّلة",dev],["منتهي/موقوف",LICS.length-on]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("");
  const q=$("#search").value.trim().toLowerCase(),f=$("#filter").value;
  const rows=LICS.filter(l=>(!q||[l.teacher_name,l.school,l.code,l.phone].join(" ").toLowerCase().includes(q))&&
    (f==="all"||(f==="on"&&l.active&&!isExp(l))||(f==="off"&&!l.active)||(f==="exp"&&isExp(l))));
  $("#list").innerHTML=rows.length?rows.map(l=>{
    const st=!l.active?["موقوف","#888"]:isExp(l)?["منتهي","#f39c12"]:["فعّال","#0f8a3c"];
    return `<div class="lic ${!l.active?'off':isExp(l)?'exp':''}" data-c="${esc(l.code)}">
      <div class="top"><div><span class="nm">${esc(l.teacher_name)}</span> <span class="badge" style="background:${st[1]}">${st[0]}</span></div><span class="code">${esc(l.code)}</span></div>
      <div class="meta">${l.school?`<span>🏫 ${esc(l.school)}</span>`:""}${l.phone?`<span>📞 ${esc(l.phone)}</span>`:""}
        <span>📱 ${l.devices.length} / ${l.max_devices} أجهزة</span><span>⏳ ${fmtD(l.expires_at)}</span>${l.notes?`<span>📝 ${esc(l.notes)}</span>`:""}</div>
      <div class="acts">
        <button data-a="msg">📋 رسالة</button>
        <button data-a="devs">📱 الأجهزة</button>
        <button data-a="toggle" class="${l.active?'':'g'}">${l.active?'⏸ إيقاف':'▶ تفعيل'}</button>
        <button data-a="extend">⏳ تمديد</button>
        <button data-a="maxdev">➕ أجهزة</button>
        <button data-a="reset">♻️ تصفير الأجهزة</button>
        <button data-a="del" class="r">🗑</button>
      </div>
      <div class="devs">${l.devices.length?l.devices.map(d=>`<div><span>${esc(devName(d.user_agent))} — آخر استخدام: ${fmtD(d.last_seen)}</span><button data-a="rmdev" data-d="${esc(d.device_id)}" style="padding:2px 10px">حذف</button></div>`).join(""):"لا توجد أجهزة مفعّلة بعد"}</div>
    </div>`}).join(""):`<div class="card" style="text-align:center;color:#8a6f6f">لا توجد أكواد</div>`;
}
function devName(ua=""){if(/iPhone/.test(ua))return"آيفون";if(/iPad/.test(ua))return"آيباد";if(/Android/.test(ua))return/Mobile/.test(ua)?"جوال أندرويد":"تابلت أندرويد";if(/Windows/.test(ua))return"كمبيوتر ويندوز";if(/Mac/.test(ua))return"ماك";return"جهاز"}
function message(l){return `مرحبًا ${l.teacher_name} 🌷
شكرًا لاشتراكك في برنامج مسابقة العيد الوطني 🇴🇲

🔗 رابط البرنامج:
${APP_URL}

🔑 كود التفعيل: ${l.code}

📱 يعمل على ${l.max_devices} ${l.max_devices>2&&l.max_devices<11?'أجهزة':'جهاز'}
⏳ صالح حتى: ${fmtD(l.expires_at)}

الكود خاص بك، يرجى عدم مشاركته 🙏
بصمة إبداع`}
function showMsg(l){const m=message(l);$("#msgText").textContent=m;$("#created").style.display="block";
  const w=waUrls(l.phone,m);$("#waLink").href=w.web;$("#waApp").href=w.app}
function waUrls(phone,m){let ph=String(phone||"").replace(/\D/g,"");if(ph.startsWith("00"))ph=ph.slice(2);if(ph.length===8)ph="968"+ph;
  const t=encodeURIComponent(m),q=(ph?`phone=${ph}&`:"")+`text=${t}`;
  return {web:`https://api.whatsapp.com/send?${q}`,app:`whatsapp://send?${q}`}}
$("#copyMsg").onclick=async()=>{try{await navigator.clipboard.writeText($("#msgText").textContent);toast("تم النسخ ✅")}catch(e){toast("انسخ النص يدويًا")}};
$("#createBtn").onclick=async()=>{
  const name=$("#n_name").value.trim();if(!name){toast("اكتب اسم المعلمة");return}
  $("#createBtn").disabled=true;
  try{const d=await api("create",{teacher_name:name,school:$("#n_school").value,phone:$("#n_phone").value,max_devices:$("#n_dev").value,months:$("#n_months").value,notes:$("#n_notes").value});
    showMsg(d.license);toast("تم إنشاء الكود ✅");["#n_name","#n_school","#n_phone","#n_notes"].forEach(s=>$(s).value="");await load();
    $("#created").scrollIntoView({behavior:"smooth",block:"center"})}
  catch(e){toast(e.message)}$("#createBtn").disabled=false};
$("#search").oninput=render;$("#filter").onchange=render;$("#refresh").onclick=load;
$("#list").addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const card=b.closest(".lic");const code=card.dataset.c;const l=LICS.find(x=>x.code===code);const a=b.dataset.a;
  try{
    if(a==="msg"){showMsg(l);$("#created").scrollIntoView({behavior:"smooth",block:"center"});return}
    if(a==="devs"){const d=card.querySelector(".devs");d.style.display=d.style.display==="block"?"none":"block";return}
    if(a==="toggle"){await api("update",{code,active:!l.active});toast(l.active?"تم إيقاف الكود":"تم تفعيل الكود")}
    if(a==="extend"){const m=await ask(`<h2>⏳ تمديد اشتراك ${esc(l.teacher_name)}</h2>`,[{t:"٣ أشهر",v:3},{t:"٦ أشهر",v:6},{t:"سنة",v:12,c:"g"},{t:"بدون انتهاء",v:"none"},{t:"إلغاء",v:null}]);
      if(m===null)return;await api("update",m==="none"?{code,no_expiry:true}:{code,extend_months:m});toast("تم التمديد ✅")}
    if(a==="maxdev"){const m=await ask(`<h2>📱 عدد الأجهزة المسموح لـ ${esc(l.teacher_name)}</h2><p>الحالي: ${l.max_devices}</p>`,[1,2,3,4,5].map(n=>({t:String(n),v:n,c:n===l.max_devices?"g":""})).concat([{t:"إلغاء",v:null}]));
      if(m===null)return;await api("update",{code,max_devices:m});toast("تم التعديل ✅")}
    if(a==="reset"){if(!await ask(`<h2>♻️ تصفير أجهزة ${esc(l.teacher_name)}؟</h2><p>ستحتاج المعلمة لإدخال الكود من جديد على أجهزتها.</p>`,[{t:"نعم",v:true,c:"r"},{t:"إلغاء",v:false}]))return;
      await api("reset_devices",{code});toast("تم التصفير")}
    if(a==="rmdev"){await api("remove_device",{code,device_id:b.dataset.d});toast("تم حذف الجهاز")}
    if(a==="del"){if(!await ask(`<h2>🗑 حذف كود ${esc(l.teacher_name)} نهائيًا؟</h2>`,[{t:"حذف",v:true,c:"r"},{t:"إلغاء",v:false}]))return;
      await api("delete",{code});toast("تم الحذف")}
    await load();
  }catch(err){toast(err.message)}
});
if(PW)api("login").then(start).catch(()=>{});
</script>
</body>
</html>
